<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Finder</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --panel2: #1e242c; --line: #2a323c;
    --ink: #e8edf2; --muted: #9aa7b4; --accent: #4f9dff; --ok: #46c17d;
    --warn: #e5b451; --bad: #ef6a6a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .pill { font-size: 12px; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); }
  main { display: grid; grid-template-columns: 360px 1fr; gap: 0; height: calc(100vh - 55px); }
  .side { padding: 18px 20px; overflow-y: auto; border-right: 1px solid var(--line);
    background: var(--panel); }
  .content { padding: 18px 22px; overflow-y: auto; }
  label { display: block; font-weight: 600; margin: 14px 0 5px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  input[type=text], textarea { width: 100%; background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  textarea { resize: vertical; min-height: 52px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin: 4px 0; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 14px; background: var(--panel2); color: var(--ink);
    cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #07101c; }
  button.go { background: var(--ok); border-color: var(--ok); color: #04140c; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; }
  #status { color: var(--muted); }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted);
    background: #0b0e12; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    height: 150px; overflow-y: auto; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--panel2); color: var(--muted); font-size: 12px; }
  tr:hover td { background: #12161b; }
  .v-Eligible { color: var(--ok); } .v-Likely { color: #9fd9b6; }
  .v-Unlikely { color: var(--warn); } .v-Unknown { color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Job Finder</h1>
  <span id="llm" class="pill">LLM: …</span>
  <span id="prof" class="pill">Profile: …</span>
  <button id="buildBtn" style="margin-left:auto">Rebuild profile from CV</button>
</header>

<main>
  <section class="side">
    <label>Target roles <span class="hint">(comma-separated)</span></label>
    <input type="text" id="roles" placeholder="Data Analyst, Business Analyst" />

    <label>Experience level(s)</label>
    <div class="checks" id="levels"></div>

    <label>Countries</label>
    <div class="checks" id="countries"></div>

    <label>Cities <span class="hint">(comma-separated; blank = country-wide)</span></label>
    <input type="text" id="cities" placeholder="Bengaluru, Mumbai" />

    <label>Sources</label>
    <div class="checks" id="sources"></div>

    <label>Career-page companies <span class="hint">(name or URL, comma/newline)</span></label>
    <textarea id="career" placeholder="Figma, https://boards.greenhouse.io/acme"></textarea>

    <label>Workday pages <span class="hint">(one per line: Name | URL)</span></label>
    <textarea id="workday" placeholder="Nvidia | https://nvidia.wd5.myworkdayjobs.com/..."></textarea>

    <div class="row">
      <button class="primary" id="searchBtn">Search</button>
      <button id="saveBtn">Save settings</button>
    </div>
  </section>

  <section class="content">
    <div class="card">
      <div id="status">Ready. Set your filters and hit Search.</div>
      <div id="summary" class="muted" style="margin-top:6px"></div>
    </div>
    <div id="log"></div>
    <div class="row" style="margin:14px 0">
      <button class="go" id="approveBtn" disabled>Approve &amp; save to tracker</button>
    </div>
    <div style="overflow-x:auto">
      <table id="results"><thead><tr>
        <th>Title</th><th>Company</th><th>Source</th><th>Type</th>
        <th class="num">Match</th><th>Eligibility</th><th class="num">Fit</th>
        <th>Salary</th><th>Location</th><th>Link</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let currentJob = null, poll = null;

function chk(container, items, value, checked) {
  container.innerHTML = "";
  for (const it of items) {
    const id = container.id + "_" + it[value];
    const wrap = document.createElement("label");
    wrap.innerHTML = `<input type="checkbox" value="${it[value]}" ${checked.includes(it[value]) ? "checked" : ""}/> ${it.label}`;
    container.appendChild(wrap);
  }
}
function picked(container) {
  return [...container.querySelectorAll("input:checked")].map(i => i.value);
}
function esc(s) { return (s ?? "").toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function loadMeta() {
  const m = await (await fetch("/api/meta")).json();
  const s = m.saved_settings || {};
  chk($("levels"), m.levels.map(l => ({code:l.code, label:l.label})), "code", s.levels || ["2"]);
  chk($("countries"), m.countries.map(c => ({country:c, label:c})), "country", s.countries || [m.countries[0]]);
  chk($("sources"), m.sources.map(x => ({key:x.key, label:x.label})), "key", s.sources || m.sources.map(x=>x.key));
  $("roles").value = s.roles || (m.profile.roles || []).join(", ");
  $("career").value = s.career || "";
  $("workday").value = s.workday || "";
  const llm = $("llm");
  llm.textContent = "LLM: " + m.llm.chain;
  llm.className = "pill " + (m.llm.ok ? "ok" : "bad");
  const p = m.profile;
  $("prof").textContent = `Profile: ${p.years_experience}y exp · ${(p.roles||[]).length} roles · ${(p.skills||[]).length} skills`;
}

function form() {
  return {
    roles: $("roles").value, levels: picked($("levels")),
    countries: picked($("countries")), cities: $("cities").value,
    sources: picked($("sources")), career: $("career").value,
    workday: $("workday").value,
  };
}

async function buildProfile() {
  $("buildBtn").disabled = true; $("status").textContent = "Building profile from your CV…";
  try {
    const r = await fetch("/api/build-profile", {method:"POST"});
    const d = await r.json();
    $("status").textContent = d.ok ? d.note : ("Profile: " + d.error);
    if (d.ok) await loadMeta();
  } finally { $("buildBtn").disabled = false; }
}

async function saveSettings() {
  const r = await fetch("/api/save-settings", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(form())});
  if (!r.ok) { $("status").textContent = "Save failed: " + (await r.json()).detail; return; }
  const d = await r.json();
  $("status").textContent = `Settings saved to ${d.path}. Scheduled run: ${d.headless_cmd}`;
}

async function search() {
  $("searchBtn").disabled = true; $("approveBtn").disabled = true;
  $("results").querySelector("tbody").innerHTML = "";
  $("summary").textContent = ""; $("log").textContent = "";
  $("status").textContent = "Searching… this can take a few minutes.";
  const r = await fetch("/api/search", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(form())});
  currentJob = (await r.json()).job_id;
  try { localStorage.setItem("jobId", currentJob); } catch (e) {}
  if (poll) clearInterval(poll);
  poll = setInterval(pollJob, 1500); pollJob();
}

// Reconnect to an in-flight or finished search after a page reload: the search
// runs on the server, so we only lost the client-side handle. Re-fetch its
// status and either resume polling (running) or render the result (done/error).
async function resumeJob() {
  let id;
  try { id = localStorage.getItem("jobId"); } catch (e) { return; }
  if (!id) return;
  let r;
  try { r = await fetch("/api/search/" + id); } catch (e) { return; }
  if (!r.ok) { try { localStorage.removeItem("jobId"); } catch (e) {} return; }
  const d = await r.json();
  if (!d.status) { try { localStorage.removeItem("jobId"); } catch (e) {} return; }
  currentJob = id;
  if (d.status === "running") {
    $("status").textContent = "Reconnected to a search already running…";
    if (poll) clearInterval(poll);
    poll = setInterval(pollJob, 1500); pollJob();
  } else {
    pollJob();  // render the finished (done/error) result
  }
}

async function pollJob() {
  if (!currentJob) return;
  const d = await (await fetch("/api/search/" + currentJob)).json();
  $("log").textContent = (d.log || []).join("\n");
  $("log").scrollTop = $("log").scrollHeight;
  if (d.status === "running") return;
  clearInterval(poll); poll = null; $("searchBtn").disabled = false;
  if (d.status === "error") { $("status").textContent = "Search failed: " + d.error; return; }
  const s = d.summary || {};
  $("status").textContent = `Done — ${s.total} live job(s).`;
  $("summary").textContent =
    `${s.linkedin} LinkedIn · ${s.career} career · ${s.other} other.  Filtered out: `
    + `${s.dropped_salary} salary, ${s.dropped_senior} senior, `
    + `${s.dropped_duplicate} duplicates, ${s.dropped_tracked} already-tracked, `
    + `${s.dropped_ineligible} not-eligible.`;
  render(d.jobs || []);
  $("approveBtn").disabled = (s.total || 0) === 0;
}

function render(jobs) {
  const tb = $("results").querySelector("tbody"); tb.innerHTML = "";
  for (const j of jobs) {
    const sal = j.salary || (j.salary_lpa == null ? "—" : j.salary_lpa + " LPA");
    const v = j.eligibility || "";
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${esc(j.title)}</td><td>${esc(j.company)}</td>`
      + `<td>${esc(j.source || j._bucket)}</td><td>${esc(j.role_type)}</td>`
      + `<td class="num">${j.match_score ?? ""}</td>`
      + `<td class="v-${esc(v)}" title="${esc(j.fit_reason||"")}">${esc(v)}</td>`
      + `<td class="num">${j.fit_score ?? ""}</td>`
      + `<td>${esc(sal)}</td><td>${esc(j.location)}</td>`
      + `<td><a href="${esc(j.job_link)}" target="_blank" rel="noopener">open</a></td>`;
    tb.appendChild(tr);
  }
}

async function approve() {
  $("approveBtn").disabled = true; $("status").textContent = "Writing to tracker…";
  const r = await fetch("/api/write/" + currentJob, {method:"POST"});
  if (!r.ok) { $("status").textContent = "Write failed: " + (await r.json()).detail;
               $("approveBtn").disabled = false; return; }
  const d = await r.json();
  $("status").textContent = `Saved. +${d.added} new in ${d.master_file} (${d.master_total} total). Workbook: ${d.path}`;
}

$("buildBtn").onclick = buildProfile;
$("saveBtn").onclick = saveSettings;
$("searchBtn").onclick = search;
$("approveBtn").onclick = approve;
loadMeta().catch(e => $("status").textContent = "Failed to load: " + e).then(resumeJob);
</script>
</body>
</html>
